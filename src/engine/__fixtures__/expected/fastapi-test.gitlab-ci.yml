regression-test:
  stage: fastapi-test
  image: python:latest
  variables:
    GIT_DEPTH: "0"
    UV_CACHE_DIR: $CI_PROJECT_DIR/.cache/uv
  timeout: 10 minutes
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .cache/uv/
  script:
    # TODO: only run when `github.event_name == 'pull_request'`
    # TODO: Check out the pull request (uses: actions/checkout@<sha>): GitLab clones the repo automatically; `fetch-depth: 0` → `GIT_DEPTH: "0"`; checking out another repo/path → clone it in `script` with `CI_JOB_TOKEN`
    - cd "$CI_PROJECT_DIR/pr"
    # TODO: `$GITHUB_OUTPUT` → plain shell variables within the job, or `artifacts:reports:dotenv` to pass values to other jobs; `$RUNNER_*` variables don't exist in GitLab; github.event.pull_request.base.sha (webhook payload) isn't exposed in GitLab CI; github.event.pull_request.head.sha (webhook payload) isn't exposed in GitLab CI
    - |-
      if [ "$CI_PIPELINE_SOURCE" = 'merge_request_event' ]; then
      export BASE_SHA="${{ github.event.pull_request.base.sha }}"
      export HEAD_SHA="${{ github.event.pull_request.head.sha }}"
      git diff --name-only --diff-filter=AM -z "$BASE_SHA" "$HEAD_SHA" -- tests \
        | while IFS= read -r -d '' file; do
            case "$(basename "$file")" in
              test_*.py) printf '%s\0' "$file" ;;
            esac
          done > "$RUNNER_TEMP/changed-tests"
      if [ -s "$RUNNER_TEMP/changed-tests" ]; then
        echo "found=true" >> "$GITHUB_OUTPUT"
        git diff --binary "$BASE_SHA" "$HEAD_SHA" -- tests \
          > "$RUNNER_TEMP/tests.patch"
      else
        echo "found=false" >> "$GITHUB_OUTPUT"
        echo "No added or modified test files; regression proof is not applicable."
      fi
      fi
    # TODO: only run when `steps.changed-tests.outputs.found == 'true'`
    # TODO: Check out the base revision (uses: actions/checkout@<sha>): GitLab clones the repo automatically; checking out another repo/path → clone it in `script` with `CI_JOB_TOKEN`; custom `ref: ${{ github.event.pull_request.base.sha }}` → `git checkout` in script
    # TODO: only run when `steps.changed-tests.outputs.found == 'true'`
    # TODO: Set up Python (uses: actions/setup-python@<sha>): Version comes from `base/.python-version`; pin the matching tag on the `python` image
    # TODO: only run when `steps.changed-tests.outputs.found == 'true'`
    - pip install uv
    # TODO: only run when `steps.changed-tests.outputs.found == 'true'`
    - cd "$CI_PROJECT_DIR/base"
    # TODO: no job summaries in GitLab; publish a report as an artifact instead; `$RUNNER_*` variables don't exist in GitLab
    - |-
      git apply "$RUNNER_TEMP/tests.patch"
      uv sync --locked --no-dev --group tests --extra all
      set +e
      xargs -0 uv run --no-sync pytest -- < "$RUNNER_TEMP/changed-tests"
      status=$?
      set -e
      if [ "$status" -eq 0 ]; then
        echo "::warning::The changed tests already pass on the base revision. Check whether the fix is still needed."
        echo "### Regression proof: base already passes :warning:" >> "$GITHUB_STEP_SUMMARY"
        echo "The changed tests pass without the pull request's code changes." >> "$GITHUB_STEP_SUMMARY"
      else
        echo "The changed tests fail on the base revision as expected (pytest exit code $status)."
        echo "### Regression proof: base fails as expected :white_check_mark:" >> "$GITHUB_STEP_SUMMARY"
      fi

