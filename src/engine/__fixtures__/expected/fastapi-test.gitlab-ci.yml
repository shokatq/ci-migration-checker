# Generated by CI Migration Checker from .github/workflows/fastapi-test.yml.
# This is a starting point: search for TODO, review every job, and test on a branch.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"

stages:
  - fastapi-test

variables:
  UV_NO_SYNC: "true"
  INLINE_SNAPSHOT_DEFAULT_FLAGS: review

# TODO: GitHub's ubuntu runner has many tools preinstalled; pick an image with what this job needs
