changes:
  stage: fastapi-test
  image: ubuntu:24.04
  timeout: 5 minutes
  script:
    # TODO: uses: dorny/paths-filter@<sha>: → `rules:changes` on the jobs that should be skipped
    - 'echo "TODO: port this job"'

# TODO: job condition not converted: needs.changes.outputs.src == 'true' || github.ref == 'refs/heads/master'
test:
  stage: fastapi-test
  image: python:$PYTHON_VERSION
  needs:
    - changes
  variables:
    UV_PYTHON: $PYTHON_VERSION
    UV_RESOLUTION: $UV_RESOLUTION
    STARLETTE_SRC: $STARLETTE_SRC
    UV_CACHE_DIR: $CI_PROJECT_DIR/.cache/uv
  parallel:
    matrix:
      - OS:
          - ubuntu-latest
        PYTHON_VERSION:
          - "3.14"
        COVERAGE:
          - coverage
        UV_RESOLUTION:
          - highest
        STARLETTE_SRC:
          - starlette-git
        DEPRECATED_TESTS:
          - test-deprecation
  timeout: 10 minutes
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .cache/uv/
  script:
    # TODO: expression `toJson(github)` needs rewriting as shell logic
    - export GITHUB_CONTEXT="${{ toJson(github) }}"
    - echo "$GITHUB_CONTEXT"
    - pip install uv
    - uv sync --no-dev --group tests --extra all
    - |-
      if [ "$UV_RESOLUTION" = 'lowest-direct' ]; then
      uv pip install "pydantic==2.9.0"
      fi
    - |-
      if [ "$STARLETTE_SRC" = 'starlette-git' ]; then
      uv pip install "git+https://github.com/Kludex/starlette@main"
      fi
    - |-
      if [ "$DEPRECATED_TESTS" = 'test-deprecation' ]; then
      uv pip install orjson ujson
      fi
    - |-
      if [ "$WITHOUT_HTTPX2" = 'true' ]; then
      uv pip uninstall httpx2
      fi
    - |-
      if [ "$PYTHON_VERSION" = '3.14t' ] && [ "$OS" = 'ubuntu-latest' ]; then
      DISABLE_SQLALCHEMY_CEXT=1 uv pip install --force-reinstall --no-binary :all: sqlalchemy
      fi
    - mkdir coverage
    # TODO: runner.os has no GitLab equivalent; expression `(matrix.without-httpx2 == 'true') && '-W ignore::UserWarning' || ''` needs rewriting as shell logic
    - export COVERAGE_FILE="coverage/.coverage.${{ runner.os }}-py$PYTHON_VERSION-$DEPRECATED_TESTS"
    - export CONTEXT="${{ runner.os }}-py$PYTHON_VERSION-$DEPRECATED_TESTS"
    - export PYTEST_OPTIONS="${{ (matrix.without-httpx2 == 'true') && '-W ignore::UserWarning' || '' }}"
    - uv run --no-sync bash scripts/test-cov.sh $PYTEST_OPTIONS
  artifacts:
    name: coverage-${{ runner.os }}-$PYTHON_VERSION-$DEPRECATED_TESTS-${{ hashFiles('**/coverage/.coverage.*') }}
    paths:
      - coverage

