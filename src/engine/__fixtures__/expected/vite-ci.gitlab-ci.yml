# Generated by CI Migration Checker from .github/workflows/vite-ci.yml.
# This is a starting point: search for TODO, review every job, and test on a branch.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^(main|release\/[^\/]*|feat\/[^\/]*|fix\/[^\/]*|perf\/[^\/]*|v[0-9]+|v[0-9]+\.[0-9]+)$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - vite-ci

variables:
  NODE_OPTIONS: --max-old-space-size=6144
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  VITEST_SEGFAULT_RETRY: "3"

default:
  interruptible: true

# TODO: GitHub's ubuntu runner has many tools preinstalled; pick an image with what this job needs
# TODO: job outputs → artifacts:reports:dotenv
changed:
  stage: vite-ci
  image: ubuntu:24.04
  variables:
    GIT_DEPTH: "50"
  script:
    # TODO: Get changed files (uses: tj-actions/changed-files@<sha>): → `rules:changes` on the jobs that should be skipped
    - 'echo "TODO: port this job"'

# TODO: macos-latest, windows-latest legs were dropped from the matrix; they need GitLab Windows/macOS runners (tags)
# TODO: job condition not converted: needs.changed.outputs.should_skip != 'true'
test:
  stage: vite-ci
  image: node:$NODE_VERSION
  needs:
    - changed
  variables:
    npm_config_store_dir: $CI_PROJECT_DIR/.pnpm-store
  parallel:
    matrix:
      - OS:
          - ubuntu-latest
        NODE_VERSION:
          - "20"
          - "22"
          - "24"
          - "26"
  timeout: 20 minutes
  cache:
    - key:
        files:
          - pnpm-lock.yaml
      paths:
        - .pnpm-store/
    - key: ${{ runner.os }}-playwright-bin-v1-$PLAYWRIGHT_VERSION
      paths:
        - $PLAYWRIGHT_BROWSERS_PATH
  script:
    # TODO: only run when `matrix.node_version != '20'`
    - corepack enable
    # TODO: only run when `runner.os != 'Windows'`
    # TODO: `$GITHUB_ENV` → `export NAME=value` (all script lines share one shell)
    - |-
      echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/playwright-bin" >> $GITHUB_ENV
      PLAYWRIGHT_VERSION="$(pnpm ls --depth 0 --json -w playwright-chromium | jq --raw-output '.[0].devDependencies["playwright-chromium"].version')"
      echo "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" >> $GITHUB_ENV
    # TODO: only run when `runner.os == 'Windows'`
    # TODO: `$GITHUB_ENV` → `export NAME=value` (all script lines share one shell)
    - |-
      echo "PLAYWRIGHT_BROWSERS_PATH=$HOME\.cache\playwright-bin" >> $env:GITHUB_ENV
      $env:PLAYWRIGHT_VERSION="$(pnpm ls --depth 0 --json -w playwright-chromium | jq --raw-output '.[0].devDependencies["playwright-chromium"].version')"
      echo "PLAYWRIGHT_VERSION=$env:PLAYWRIGHT_VERSION" >> $env:GITHUB_ENV
    # TODO: Cache Playwright's binary (uses: actions/cache@<sha>): → `cache:` with the same paths and key; runner.os has no GitLab equivalent; `restore-keys` → `cache:fallback_keys` if you need them
    - pnpm playwright install chromium
    - pnpm run build
    # TODO: only run when `matrix.node_version == '20'`
    - pnpm runtime set node $NODE_VERSION -g
    - pnpm run test-unit
    - pnpm run test-serve
    - pnpm run test-serve-bundled
    - pnpm run test-build

# TODO: GitHub's ubuntu runner has many tools preinstalled; pick an image with what this job needs
test-passed:
  stage: vite-ci
  image: ubuntu:24.04
  needs:
    - test
  script:
    - echo "Build & Test Passed or Skipped"

# TODO: GitHub's ubuntu runner has many tools preinstalled; pick an image with what this job needs
test-failed:
  stage: vite-ci
  image: ubuntu:24.04
  needs:
    - test
  rules:
    - when: on_failure
  script:
    - echo "Build & Test Failed"

lint:
  stage: vite-ci
  image: node:24
  variables:
    npm_config_store_dir: $CI_PROJECT_DIR/.pnpm-store
  timeout: 10 minutes
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
  script:
    - corepack enable
    - pnpm run build
    - pnpm run lint
    - pnpm format && git diff --exit-code
    - pnpm run typecheck
    - pnpm run test-docs
