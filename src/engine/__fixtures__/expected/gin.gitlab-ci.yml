workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"

stages:
  - gin

lint:
  stage: gin
  image: golang:1
  variables:
    GIT_DEPTH: "0"
  script:
    # TODO: Setup golangci-lint (uses: golangci/golangci-lint-action@v9): → `golangci-lint run` using the `golangci/golangci-lint` image
    # TODO: install golangci-lint v2.11 or use the golangci/golangci-lint image
    - golangci-lint run --verbose

test:
  stage: gin
  image: golang:$GO
  needs:
    - lint
  variables:
    GO111MODULE: on
    TESTTAGS: $TEST_TAGS
    GOPROXY: https://proxy.golang.org
  parallel:
    matrix:
      - OS:
          - ubuntu-latest
        GO:
          - "1.26"
          - "1.27"
        TEST_TAGS:
          - ""
          - -tags nomsgpack
          - --ldflags="-checklinkname=0" -tags sonic
          - -tags go_json
          - -race
  cache:
    key:
      files:
        - go.sum
    paths:
      - $GO_BUILD
  script:
    # TODO: uses: actions/cache@v6: → `cache:` with the same paths and key; GitLab only caches paths inside the project dir; point the tool's cache directory there with an env var; `restore-keys` → `cache:fallback_keys` if you need them
