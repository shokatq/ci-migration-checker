# Generated by CI Migration Checker from .github/workflows/flask-tests.yml.
# This is a starting point: search for TODO, review every job, and test on a branch.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^(main|stable)$/

stages:
  - flask-tests

default:
  interruptible: true

tests:
  stage: flask-tests
  image: python:$PYTHON
  variables:
    UV_CACHE_DIR: $CI_PROJECT_DIR/.cache/uv
  parallel:
    matrix:
      - PYTHON:
          - "3.15"
      - PYTHON:
          - "3.14"
      - PYTHON:
          - 3.14t
      - NAME:
          - Windows
        PYTHON:
          - "3.14"
        OS:
          - windows-latest
      - NAME:
          - Mac
        PYTHON:
          - "3.14"
        OS:
          - macos-latest
      - PYTHON:
          - "3.13"
      - PYTHON:
          - "3.12"
      - PYTHON:
          - "3.11"
      - NAME:
          - PyPy
        PYTHON:
          - pypy-3.11
        TOX:
          - pypy3.11
      - NAME:
          - Minimum Versions
        PYTHON:
          - "3.14"
        TOX:
          - tests-min
      - NAME:
          - Development Versions
        PYTHON:
          - "3.11"
        TOX:
          - tests-dev
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .cache/uv/
  script:
    - pip install uv
    # TODO: expression `matrix.tox || format('py{0}', matrix.python)` needs rewriting as shell logic
    - export TOX_ENV="${{ matrix.tox || format('py{0}', matrix.python) }}"
    - uv run --locked --no-default-groups --group dev tox run

typing:
  stage: flask-tests
  image: python:latest
  variables:
    UV_CACHE_DIR: $CI_PROJECT_DIR/.cache/uv
  cache:
    - key:
        files:
          - uv.lock
      paths:
        - .cache/uv/
    - key:
        files:
          - pyproject.toml
        prefix: mypy
      paths:
        - ./.mypy_cache
  script:
    - pip install uv
    # TODO: uses: actions/setup-python@<sha>: Version comes from `pyproject.toml`; pin the matching tag on the `python` image
    - uv run --locked --no-default-groups --group dev tox run -e typing
