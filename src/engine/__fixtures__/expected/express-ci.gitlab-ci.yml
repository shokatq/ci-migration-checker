# Generated by CI Migration Checker from .github/workflows/express-ci.yml.
# This is a starting point: search for TODO, review every job, and test on a branch.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^(master|develop|4\.x|5\.x|5\.0)$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - express-ci

default:
  interruptible: true

lint:
  stage: express-ci
  image: node:lts
  script:
    - npm install --ignore-scripts --include=dev
    - npm run lint

# TODO: windows-latest legs were dropped from the matrix; they need GitLab Windows/macOS runners (tags)
test:
  stage: express-ci
  image: node:$NODE_VERSION
  parallel:
    matrix:
      - OS:
          - ubuntu-latest
        NODE_VERSION:
          - "18"
          - "19"
          - "20"
          - "21"
          - "22"
          - "23"
          - "24"
          - "25"
          - "26"
  script:
    - npm config set loglevel error
    - npm install
    - |-
      echo "Node.js version: $(node -v)"
      echo "NPM version: $(npm -v)"
    - npm run test-ci
  artifacts:
    name: coverage-node-$NODE_VERSION-$OS
    paths:
      - ./coverage/lcov.info
    expire_in: 1 day

# TODO: GitHub's ubuntu runner has many tools preinstalled; pick an image with what this job needs
coverage:
  stage: express-ci
  image: ubuntu:24.04
  needs:
    - test
  script:
    # TODO: Docker images ship without apt lists; run `apt-get update` first
    - apt-get -y install lcov
    # TODO: Collect coverage reports (uses: actions/download-artifact@<sha>): Artifacts from `needs` jobs are restored automatically, but at their original paths, not under `path:`
    - find ./coverage -name lcov.info -exec printf '-a %q\n' {} \; | xargs lcov -o ./lcov.info
    # TODO: Upload coverage report (uses: coverallsapp/github-action@<sha>): → run the Coveralls CLI in `script` with COVERALLS_REPO_TOKEN
